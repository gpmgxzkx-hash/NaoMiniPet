name: Build NaoMiniPet APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract
        run: |
          mkdir project
          unzip -q NaoMiniPet_Project_v0.6.zip -d project

      - name: Fix Java 17
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("project/app/build.gradle.kts")
          s = p.read_text()

          if "compileOptions" not in s:
              pos = s.rfind("}")
              insert = '''
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          '''
              s = s[:pos] + insert + s[pos:]

          p.write_text(s)
          PY

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: NaoMiniPet-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
